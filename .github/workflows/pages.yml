name: Publish GitHub Pages

# Publication stays manual: a future push does not publish by itself.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Build and validate the Pages paths
        env:
          SITE_URL: https://rober-prog.github.io
          BASE_PATH: /habitalia-consulting/
        run: |
          npm run build
          npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
